<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css" integrity="sha384-wuqJ3gKnD2BDa/kF14f6SECESfcvVTsNruuVi3BOAk2mNDIOn/uvHdd+eMK7FY0b" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/material-icons@1.13.14/iconfont/material-icons.css" integrity="sha256-hyKQMSVr7POLGjxEcB+AR+QcuJWYVx8xA57WW1Dnvlw=" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/mdui.theme.enhanced.css">
  <link rel="stylesheet" href="/css/mdui.patch.css">
  <link rel="stylesheet" href="/css/xf.css">
  <link rel="stylesheet" href="/css/rtl.css">
  <script>/* 提前按已保存的语言偏好设置 lang 与 RTL 方向，避免加载后布局翻转闪烁。RTL 语言代码与 js/common/i18n.js 保持一致。 */
  try { var o = JSON.parse(localStorage.getItem('fdn-language-order') || 'null'); var l = (o && o[0]) || localStorage.getItem('fdn-language') || ''; if (l) { document.documentElement.lang = l; if (/^(ar|he|fa|ur|ps|dv|ku|sd)(-|$)/i.test(l)) { document.documentElement.dir = 'rtl'; } } } catch (e) {}
  </script>
  <link rel="icon" href="/data/software/0/icon.avif">
  <title data-i18n="language.pageTitle">语言设置 - FCL下载站</title>
  <meta name="description" data-i18n-attr="content" data-i18n="language.description" content="设置FCL下载站的界面语言与回退顺序。">
  <meta property="og:title" data-i18n-attr="content" data-i18n="language.pageTitle" content="语言设置 - FCL下载站">
  <meta property="og:description" data-i18n-attr="content" data-i18n="language.description" content="设置FCL下载站的界面语言与回退顺序。">
  <meta property="og:image" content="https://foldcraftlauncher.cn/media/img/thumbnail/thumbnail.webp">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" data-i18n-attr="content" data-i18n="language.pageTitle" content="语言设置 - FCL下载站">
  <meta name="twitter:description" data-i18n-attr="content" data-i18n="language.description" content="设置FCL下载站的界面语言与回退顺序。">
  <meta name="twitter:image" content="https://foldcraftlauncher.cn/media/img/thumbnail/thumbnail.webp">
  <link rel="canonical" href="https://foldcraftlauncher.cn/html/language.html">
</head>

<body class="mdui-appbar-with-toolbar mdui-container-fluid mdui-theme-layout-auto">
  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <a href="javascript: window.history.back();" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">arrow_back</i></a>
      <a href="/" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">home</i></a>
      <a href="" class="mdui-typo-title" data-i18n="language.title">语言设置</a>
      <div class="mdui-toolbar-spacer"></div>
      <a href="javascript:void(0);" id="menu_btn" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">menu</i></a>
    </div>
  </div>

  <div>
    <div class="mdui-panel" mdui-panel>
      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div data-i18n="language.order">语言顺序</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body">
          <div class="mdui-typo">
            <p data-i18n="language.hint">列表顺序即语言优先级：排在最前的语言为界面显示语言，其余语言在翻译缺失时按顺序依次回退。拖动或使用上下按钮调整顺序，修改后需刷新页面以完全生效。</p>
            <p data-i18n="language.warning">注意：除简体中文外的其它语言均为 AI 翻译，可能不完全准确。</p>
          </div>
          <div id="language-list"></div>
        </div>
      </div>
      <div id="sponsorRemindContainer"></div>
      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div data-i18n="language.table">语言比较表</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body">
          <div id="loadLanguageDescription">
            <div class="mdui-typo">
              <p data-i18n="language.tableHint">点击下方按钮以加载语言比较表，可能会需要一些时间。</p>
            </div>
            <a href="javascript:void(0);" id="loadLanguageTableBtn" class="mdui-btn mdui-btn-raised mdui-btn-block mdui-ripple" data-i18n="language.loadTable">加载语言比较表</a>
          </div>
          <div id="language-compare"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js" integrity="sha384-Iw/ABpFbyL5jmtL3QSGm+kpo+Rnj0Cs4NoQm69VmGC7j4pcv5MbN55KVNMMyB4J6" crossorigin="anonymous"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/language.js"></script>

</body>

</html>
