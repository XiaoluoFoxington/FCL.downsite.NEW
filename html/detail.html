<!doctype html>
<html lang="zh-cn">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css" integrity="sha384-wuqJ3gKnD2BDa/kF14f6SECESfcvVTsNruuVi3BOAk2mNDIOn/uvHdd+eMK7FY0b" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/mdui.edit.css">
  <link rel="stylesheet" href="/css/xf.css">
  <title>详情</title>
</head>

<body class="mdui-appbar-with-toolbar mdui-container-fluid mdui-theme-layout-auto">
  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <a href="javascript: window.history.back();" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons">arrow_back</i></a>
      <a href="/" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons">home</i></a>
      <a href="list.html" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons">list</i></a>
      <a href="" class="mdui-btn mdui-btn-icon mdui-ripple"><img src="" class="mdui-img-fluid" id="icon"></a>
      <a href="" class="mdui-typo-title" id="title">详情</a>
      <div class="mdui-toolbar-spacer"></div>
      <a href="javascript:void(0);" id="menu_btn" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons">menu</i></a>
    </div>
  </div>

  <div>
    <div class="mdui-panel" mdui-panel>
      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div>操作</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body" id="operationTable">
          <div>
            <div class="mdui-row">
              <div class="mdui-col-xs-12 mdui-col-sm-4">
                <!-- 禁用是因为此时还未初始化下载控制器，直接点击会报错未提供软件ID。MDUI 已处理 <a disabled> 的样式与交互。 -->
                <a id="btn-download" class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" href="/html/down.html" disabled><i class="mdui-icon material-icons">file_download</i> 下载资源</a>
              </div>
              <div class="mdui-col-xs-12 mdui-col-sm-4">
                <a id="btn-intro" class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" href="/html/intro.html" disabled><i class="mdui-icon material-icons">description</i> 介绍文档</a>
              </div>
              <div class="mdui-col-xs-12 mdui-col-sm-4">
                <a id="btn-history" class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" href="/html/rh.html" disabled><i class="mdui-icon material-icons">track_changes</i> 版本历史</a>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div>基本信息</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body mdui-typo" id="infoTable">
          <div class="mdui-table-fluid">
            <table class="mdui-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th>值</th>
                </tr>
              </thead>
              <tbody id="basic-info-body">
                <!-- 将由JS生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div>线路预览</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body mdui-typo">
          <div class="mdui-typo">
            <p>随机选择线路：<span id="is-random-select"></span></p>
          </div>
          <div class="mdui-table-fluid">
            <table class="mdui-table">
              <thead>
                <tr>
                  <th>线路ID</th>
                  <th>线路名称</th>
                  <th>完整API URL</th>
                  <th>参与随机选择</th>
                </tr>
              </thead>
              <tbody id="mirror-info-body">
                <!-- 将由JS生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js" integrity="sha384-Iw/ABpFbyL5jmtL3QSGm+kpo+Rnj0Cs4NoQm69VmGC7j4pcv5MbN55KVNMMyB4J6" crossorigin="anonymous"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/detail.js"></script>

</body>

</html>
