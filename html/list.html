<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://unpkg.com/mdui@1.0.2/dist/css/mdui.min.css" integrity="sha384-wuqJ3gKnD2BDa/kF14f6SECESfcvVTsNruuVi3BOAk2mNDIOn/uvHdd+eMK7FY0b" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/material-icons@1.13.14/iconfont/material-icons.css" integrity="sha256-hyKQMSVr7POLGjxEcB+AR+QcuJWYVx8xA57WW1Dnvlw=" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/mdui.theme.enhanced.css">
  <link rel="stylesheet" href="/css/mdui.patch.css">
  <link rel="stylesheet" href="/css/xf.css">
  <link rel="stylesheet" href="/css/rtl.css">
  <script>/* 提前按已保存的语言偏好设置 lang 与 RTL 方向，避免加载后布局翻转闪烁。RTL 语言代码与 js/common/i18n.js 保持一致。 */
  try { var o = JSON.parse(localStorage.getItem('fdn-language-order') || 'null'); var l = (o && o[0]) || localStorage.getItem('fdn-language') || ''; if (l) { document.documentElement.lang = l; if (/^(ar|he|fa|ur|ps|dv|ku|sd)(-|$)/i.test(l)) { document.documentElement.dir = 'rtl'; } } } catch (e) {}
  </script>
  <link rel="icon" href="/data/software/0/icon.avif">
  <title data-i18n="list.pageTitle">资源列表 - FCL下载站</title>
  <meta name="description" data-i18n-attr="content" data-i18n="list.description" content="浏览FCL下载站所有可用资源，包括Fold Craft Launcher、Zalith Launcher、Pojav Launcher、MobileGlues、HMCL等启动器、渲染器与插件，支持筛选和搜索。">
  <meta name="keywords" content="资源列表, 下载列表, FCL, FoldCraftLauncher, 启动器下载, 渲染器, 插件, 我的世界, Android, MobileGlues, ZalithLauncher, PojavLauncher, HMCL">
  <meta property="og:title" data-i18n-attr="content" data-i18n="list.pageTitle" content="资源列表 - FCL下载站">
  <meta property="og:description" data-i18n-attr="content" data-i18n="list.description" content="浏览并筛选FCL下载站所有可用资源，包含启动器、渲染器、插件等。">
  <meta property="og:image" content="https://foldcraftlauncher.cn/media/img/thumbnail/thumbnail.webp">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" data-i18n-attr="content" data-i18n="list.pageTitle" content="资源列表 - FCL下载站">
  <meta name="twitter:description" data-i18n-attr="content" data-i18n="list.description" content="浏览并筛选FCL下载站所有可用资源。">
  <meta name="twitter:image" content="https://foldcraftlauncher.cn/media/img/thumbnail/thumbnail.webp">
  <link rel="canonical" href="https://foldcraftlauncher.cn/html/list.html">
</head>

<body class="mdui-appbar-with-toolbar mdui-container-fluid mdui-theme-layout-auto">
  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <a href="javascript: window.history.back();" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">arrow_back</i></a>
      <a href="/" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">home</i></a>
      <a href="" class="mdui-typo-title" data-i18n="list.title">资源列表</a>
      <div class="mdui-toolbar-spacer"></div>
      <a href="javascript:void(0);" id="menu_btn" class="mdui-btn mdui-btn-icon mdui-ripple"><i class="mdui-icon material-icons" aria-hidden="true">menu</i></a>
    </div>
  </div>

  <div>
    <div class="mdui-panel" mdui-panel>
      <div class="mdui-panel-item xf-list-filter-panel-item">
        <div class="mdui-panel-item-header mdui-ripple">
          <div><i id="filter-active-indicator-on" class="mdui-icon material-icons xf-filter-active-indicator" hidden>filter_alt</i><i id="filter-active-indicator-off" class="mdui-icon material-icons xf-filter-active-indicator">filter_alt_off</i><span data-i18n="list.filterPanel">筛选</span></div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body">
          <div class="mdui-textfield" id="filter-expression-field">
            <label class="mdui-textfield-label" data-i18n="list.filterExpression">筛选表达式</label>
            <input class="mdui-textfield-input" type="text" placeholder="name: fold &amp; tag: mcje" data-i18n="list.filterPlaceholder" data-i18n-attr="placeholder" />
            <div class="mdui-textfield-error" data-i18n="list.filterError">格式不正确，请检查表达式</div>
          </div>
          <div class="mdui-panel" mdui-panel>
            <div class="mdui-panel-item" id="filter-help-panel">
              <div class="mdui-panel-item-header mdui-ripple">
                <div data-i18n="list.filterHelpTitle">筛选帮助</div>
                <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
              </div>
              <div class="mdui-panel-item-body mdui-typo" id="filter-help-panel-body">
                <div class="xf-filter-help-scroll">
                <p><span data-i18n="list.filterHelpFormatPrefix">单个条件格式：</span><code>关系 + 键 + ":" + 值</code></p>
                <p data-i18n="list.filterHelpCombine">允许多个条件组合。首个条件无需关系。</p>
                <p><span data-i18n="list.filterHelpExampleIntro">例如筛选名字含"fold"且标签含"mcje"：</span></p>
                <p><button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="name: fold &amp; tag: mcje">name: fold &amp; tag: mcje</button></p>
                <p data-i18n="list.filterHelpClickHint">可直接点击下方文字插入到编辑框。</p>
                <p>
                  <span data-i18n="list.filterHelpRelations">可用关系：</span>
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="&amp;" data-i18n="common.relationAnd">与</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="|" data-i18n="common.relationOr">或</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="!" data-i18n="common.relationNot">非</button>
                </p>
                <p>
                  <span data-i18n="list.filterHelpKeys">可用键：</span>
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="name:">name</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="tag:">tag</button>
                </p>
                <p id="filter-help-tags"></p>
                <p>
                  <span data-i18n="list.filterHelpEscapes">可用转义：</span>
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="\&amp;">\&amp;</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="\|">\|</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="\!">\!</button>,
                  <button type="button" class="xf-inline-code xf-list-table-th-sortable" data-insert="\\">\\</button>
                </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mdui-panel-item mdui-panel-item-open">
        <div class="mdui-panel-item-header mdui-ripple">
          <div data-i18n="list.listPanel">列表</div>
          <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
        </div>
        <div class="mdui-panel-item-body">
          <div id="list-content" class="mdui-table-fluid">
            
          </div>
        </div>
      </div>

      <div id="sponsorRemindContainer"></div>
    </div>
  </div>

  <script src="https://unpkg.com/mdui@1.0.2/dist/js/mdui.min.js" integrity="sha384-Iw/ABpFbyL5jmtL3QSGm+kpo+Rnj0Cs4NoQm69VmGC7j4pcv5MbN55KVNMMyB4J6" crossorigin="anonymous"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/list.js"></script>

</body>

</html>
