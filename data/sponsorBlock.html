<meta charset="utf-8">
<div class="mdui-panel-item-header mdui-ripple">
  <div>{{sponsorBlock.title}}</div>
  <i class="mdui-panel-item-arrow mdui-icon material-icons">keyboard_arrow_down</i>
</div>
<div class="mdui-panel-item-body">
  <div class="mdui-typo">
    <p>{{sponsorBlock.desc}}</p>
    <p>{{sponsorBlock.optional}}</p>
  </div>
  <hr>
  <div class="mdui-row">
    <div class="mdui-col-xs-12 mdui-col-sm-4">
      <a class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" href="/html/sponsor.html">{{sponsorBlock.sponsorUs}}</a>
    </div>
    <div class="mdui-col-xs-12 mdui-col-sm-4">
      <button type="button" class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" id="sponsorBlockBackBtn">{{sponsorBlock.backToDownload}}</button>
    </div>
    <div class="mdui-col-xs-12 mdui-col-sm-4">
      <button type="button" class="mdui-btn mdui-btn-block mdui-btn-raised mdui-ripple" id="sponsorBlockCloseForeverBtn">{{sponsorBlock.closeForever}}</button>
    </div>
  </div>
</div>
